<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Activity Checklist</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[var(--tg-theme-bg-color,#f3f4f6)] text-[var(--tg-theme-text-color,#111827)] p-4 min-h-screen">

  <header class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-blue-600">Чеклист Активностейt</h1>
    <p class="text-xs text-gray-500 mt-1">Отсканируйте QR соответствующей активности что пометить ее выполненой</p>
    
    <!-- Progress Indicator -->
    <div class="mt-4 bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 max-w-xs mx-auto overflow-hidden">
      <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
    <div class="flex justify-between items-center max-w-xs mx-auto mt-1 px-1">
      <span id="progress-text" class="text-xs font-semibold text-gray-500">0/3 Completed</span>
      <button onclick="resetProgress()" class="text-[10px] text-red-500 hover:underline">Сбросить прогресс</button>
    </div>
  </header>

  <!-- Activity List -->
  <div id="activity-list" class="space-y-3 max-w-md mx-auto">
    <!-- Loading skeleton until data is loaded -->
    <div class="text-center text-sm text-gray-400 py-8">Грузим активности...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Default Activities List
    let activities = [
      { id: 1, title: 'Покрасьте рот серебряной краской', qrCode: 'booth_123', completed: false },
      { id: 2, title: 'Сгоняйте в Газтаун за бензаком', qrCode: 'keynote_456', completed: false },
      { id: 3, title: 'Перетанцуйте ведущего', qrCode: 'network_789', completed: false }
    ];

    let currentActivityId = null;

    // --- CLOUD STORAGE PERSISTENCE LOGIC --- //

    // Load saved data on startup
    function loadSavedState() {
      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('user_activities', (err, value) => {
          if (!err && value) {
            try {
              const savedStates = JSON.parse(value);
              // Merge saved completed statuses into our activities array
              activities.forEach(act => {
                if (savedStates[act.id] !== undefined) {
                  act.completed = savedStates[act.id];
                }
              });
            } catch (e) {
              console.error('Failed to parse CloudStorage data', e);
            }
          }
          renderActivities();
        });
      } else {
        // Fallback for local browser testing
        const saved = localStorage.getItem('user_activities');
        if (saved) {
          const savedStates = JSON.parse(saved);
          activities.forEach(act => {
            if (savedStates[act.id] !== undefined) {
              act.completed = savedStates[act.id];
            }
          });
        }
        renderActivities();
      }
    }

    // Save completed states back to Telegram Cloud
    function saveState() {
      // Map activity IDs to their completion status { 1: true, 2: false, ... }
      const stateToSave = activities.reduce((acc, act) => {
        acc[act.id] = act.completed;
        return acc;
      }, {});

      const dataString = JSON.stringify(stateToSave);

      if (tg.CloudStorage) {
        tg.CloudStorage.setItem('user_activities', dataString);
      }
      
      // Local storage fallback
      localStorage.setItem('user_activities', dataString);
    }

    // Optional: Allow user to reset their progress for testing
    function resetProgress() {
      if (confirm('Уверены что хотите сбросить весь прогресс?')) {
        activities.forEach(act => act.completed = false);
        saveState();
        renderActivities();
      }
    }

    // --- RENDER & UI LOGIC --- //

    function renderActivities() {
      const listEl = document.getElementById('activity-list');
      listEl.innerHTML = '';

      let completedCount = 0;

      activities.forEach(act => {
        if (act.completed) completedCount++;

        const item = document.createElement('div');
        item.className = `p-4 rounded-2xl border flex justify-between items-center transition-all ${
          act.completed 
            ? 'border-green-500/30 bg-green-500/10' 
            : 'border-gray-200 bg-white dark:bg-gray-800 dark:border-gray-700 shadow-sm'
        }`;

        item.innerHTML = `
          <div>
            <h3 class="font-semibold text-sm ${act.completed ? 'line-through opacity-60' : ''}">${act.title}</h3>
            <span class="text-[10px] ${act.completed ? 'text-green-500 font-bold' : 'text-gray-400'}">
              ${act.completed ? '✓ Verified' : 'Pending Verification'}
            </span>
          </div>
          ${
            act.completed
              ? `<div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center font-bold text-sm">✓</div>`
              : `<button onclick="startQrScanner(${act.id})" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-md transition-all active:scale-95">
                  Scan QR
                 </button>`
          }
        `;
        listEl.appendChild(item);
      });

      // Update progress bar
      const percent = Math.round((completedCount / activities.length) * 100);
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('progress-text').innerText = `${completedCount}/${activities.length} Completed`;
    }

    // --- QR SCANNER LOGIC --- //

    function startQrScanner(activityId) {
      currentActivityId = activityId;

      if (tg.showScanQrPopup) {
        tg.showScanQrPopup({
          text: 'Отсканьте QR'
        }, handleQrResult);
      } else {
        alert('QR Scanner is not supported on this version of Telegram.');
      }
    }

    function handleQrResult(scannedText) {
      const activity = activities.find(a => a.id === currentActivityId);

      if (activity && scannedText.trim() === activity.qrCode) {
        activity.completed = true;
        
        // Save state immediately upon completion
        saveState();
        renderActivities();
        
        tg.closeScanQrPopup();
        tg.HapticFeedback?.notificationOccurred('success');
        tg.showAlert('🎉 Активность выполнена!');
        return true; 
      } else {
        tg.HapticFeedback?.notificationOccurred('error');
        tg.showAlert('❌ Неподходящий QR для активности');
        return false;
      }
    }

    // Start by loading saved state from CloudStorage
    loadSavedState();
  </script>
</body>
</html>
