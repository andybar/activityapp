<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Activity Checklist</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Custom Tailwind Configuration to match Tinkoff / T-Bank brand colors
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tinkoff: {
              yellow: '#FFDD2D',
              yellowHover: '#FCC50D',
              dark: '#1F1F22',
              card: '#2A2A2D',
              border: '#38383C',
              text: '#FFFFFF',
              muted: '#929296'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-tinkoff-dark text-tinkoff-text p-4 min-h-screen font-sans antialiased selection:bg-tinkoff-yellow selection:text-black">

  <header class="mb-6 text-center max-w-md mx-auto pt-2">
    <!-- Brand Logo / Header Badge -->
    <div class="inline-flex items-center justify-center w-12 h-12 bg-tinkoff-yellow text-black font-extrabold text-2xl rounded-2xl mb-3 shadow-lg shadow-tinkoff-yellow/10">
      T
    </div>
    <h1 class="text-2xl font-bold tracking-tight text-white">Чеклист АкТ-ивностей</h1>
    <p class="text-xs text-tinkoff-muted mt-1">Отсканируйте QR соответствующей активности что пометить ее выполненой</p>
    
    <!-- Progress Indicator -->
    <div class="mt-5 bg-tinkoff-card border border-tinkoff-border rounded-2xl p-4 shadow-sm">
      <div class="flex justify-between items-center mb-2">
        <span id="progress-text" class="text-xs font-semibold text-tinkoff-muted">0/3 Выполнено</span>
        <button onclick="resetProgress()" class="text-xs text-tinkoff-yellow hover:underline font-medium">Сбросить прогресс</button>
      </div>
      <div class="bg-tinkoff-dark rounded-full h-2 overflow-hidden">
        <div id="progress-bar" class="bg-tinkoff-yellow h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>
  </header>

  <!-- Activity List -->
  <div id="activity-list" class="space-y-3 max-w-md mx-auto">
    <!-- Loading skeleton -->
    <div class="text-center text-xs text-tinkoff-muted py-8">Грузим активности...</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Default Activities List
    let activities = [
      { id: 1, title: 'Покрасьте рот серебряной краской', qrCode: 'booth_123', completed: false },
      { id: 2, title: 'Сгоняйте в Газтаун за бензаком', qrCode: 'keynote_456', completed: false },
      { id: 3, title: 'Перетанцуйте ведущего', qrCode: 'network_789', completed: false }
    ];


    let currentActivityId = null;

    // --- CLOUD STORAGE PERSISTENCE LOGIC --- //

    function loadSavedState() {
      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('user_activities', (err, value) => {
          if (!err && value) {
            try {
              const savedStates = JSON.parse(value);
              activities.forEach(act => {
                if (savedStates[act.id] !== undefined) {
                  act.completed = savedStates[act.id];
                }
              });
            } catch (e) {
              console.error('Failed to parse CloudStorage data', e);
            }
          }
          renderActivities();
        });
      } else {
        const saved = localStorage.getItem('user_activities');
        if (saved) {
          const savedStates = JSON.parse(saved);
          activities.forEach(act => {
            if (savedStates[act.id] !== undefined) {
              act.completed = savedStates[act.id];
            }
          });
        }
        renderActivities();
      }
    }

    function saveState() {
      const stateToSave = activities.reduce((acc, act) => {
        acc[act.id] = act.completed;
        return acc;
      }, {});

      const dataString = JSON.stringify(stateToSave);

      if (tg.CloudStorage) {
        tg.CloudStorage.setItem('user_activities', dataString);
      }
      localStorage.setItem('user_activities', dataString);
    }

    function resetProgress() {
      if (confirm('Уверены что хотите сбросить весь прогресс?')) {
        activities.forEach(act => act.completed = false);
        saveState();
        renderActivities();
      }
    }

    // --- RENDER & UI LOGIC --- //

    function renderActivities() {
      const listEl = document.getElementById('activity-list');
      listEl.innerHTML = '';

      let completedCount = 0;

      activities.forEach(act => {
        if (act.completed) completedCount++;

        const item = document.createElement('div');
        item.className = `p-4 rounded-2xl border flex justify-between items-center transition-all ${
          act.completed 
            ? 'border-green-500/30 bg-green-500/10' 
            : 'border-tinkoff-border bg-tinkoff-card shadow-md'
        }`;

        item.innerHTML = `
          <div class="pr-2">
            <h3 class="font-semibold text-sm ${act.completed ? 'line-through opacity-50' : 'text-white'}">${act.title}</h3>
            <span class="text-[11px] ${act.completed ? 'text-green-400 font-medium' : 'text-tinkoff-muted'}">
              ${act.completed ? ' Verified' : 'Pending verification'}
            </span>
          </div>
          ${
            act.completed
              ? `<div class="w-8 h-8 rounded-full bg-green-500 text-black flex items-center justify-center font-bold text-sm">✓</div>`
              : `<button onclick="startQrScanner(${act.id})" class="px-4 py-2 bg-tinkoff-yellow hover:bg-tinkoff-yellowHover text-black text-xs font-bold rounded-xl shadow-md transition-all active:scale-95">
                  Scan QR
                 </button>`
          }
        `;
        listEl.appendChild(item);
      });

      // Update progress bar & counter
      const percent = Math.round((completedCount / activities.length) * 100);
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('progress-text').innerText = `${completedCount}/${activities.length} Готово`;
    }

    // --- QR SCANNER LOGIC --- //

    function startQrScanner(activityId) {
      currentActivityId = activityId;

      if (tg.showScanQrPopup) {
        tg.showScanQrPopup({
          text: 'Сканируйте QR'
        }, handleQrResult);
      } else {
        alert('QR Scanner is not supported on this Telegram client.');
      }
    }

    function handleQrResult(scannedText) {
      const activity = activities.find(a => a.id === currentActivityId);

      if (activity && scannedText.trim() === activity.qrCode) {
        activity.completed = true;
        saveState();
        renderActivities();
        
        tg.closeScanQrPopup();
        tg.HapticFeedback?.notificationOccurred('success');
        tg.showAlert('🎉 Активность выполнена!');
        return true; 
      } else {
        tg.HapticFeedback?.notificationOccurred('error');
        tg.showAlert('❌ Неподходящий QR код для активности');
        return false;
      }
    }

    loadSavedState();
  </script>
</body>
</html>
