<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Activity Checklist</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tinkoff: {
              yellow: '#FFDD2D',
              yellowHover: '#FCC50D',
              dark: '#1F1F22',
              card: '#2A2A2D',
              border: '#38383C',
              text: '#FFFFFF',
              muted: '#929296'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-tinkoff-dark text-tinkoff-text p-4 min-h-screen font-sans antialiased selection:bg-tinkoff-yellow selection:text-black">

  <!-- ==================== MAIN LIST SCREEN ==================== -->
  <div id="screen-list" class="max-w-md mx-auto">
    <header class="mb-6 text-center pt-2">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-tinkoff-yellow text-black font-extrabold text-2xl rounded-2xl mb-3 shadow-lg shadow-tinkoff-yellow/10">
        T
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Activities</h1>
      <p class="text-xs text-tinkoff-muted mt-1">Select a task to view details and verify</p>
      
      <!-- Progress Indicator -->
      <div class="mt-5 bg-tinkoff-card border border-tinkoff-border rounded-2xl p-4 shadow-sm">
        <div class="flex justify-between items-center mb-2">
          <span id="progress-text" class="text-xs font-semibold text-tinkoff-muted">0/3 Completed</span>
          <button onclick="resetProgress()" class="text-xs text-tinkoff-yellow hover:underline font-medium">Reset</button>
        </div>
        <div class="bg-tinkoff-dark rounded-full h-2 overflow-hidden">
          <div id="progress-bar" class="bg-tinkoff-yellow h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </header>

    <!-- Activity Cards Container -->
    <div id="activity-list" class="space-y-3">
      <div class="text-center text-xs text-tinkoff-muted py-8">Loading tasks...</div>
    </div>
  </div>


  <!-- ==================== TASK DETAIL SCREEN ==================== -->
  <div id="screen-detail" class="max-w-md mx-auto hidden">
    <!-- Navigation Back Button (Fallback UI) -->
    <button onclick="showListScreen()" class="mb-4 inline-flex items-center text-xs text-tinkoff-muted hover:text-white transition">
      ← Back to Activities
    </button>

    <div class="bg-tinkoff-card border border-tinkoff-border rounded-3xl p-6 shadow-xl">
      <!-- Badge -->
      <div id="detail-status-badge" class="inline-block px-3 py-1 rounded-full text-[10px] font-bold mb-3 bg-tinkoff-yellow/20 text-tinkoff-yellow">
        Pending
      </div>

      <!-- Task Header -->
      <h2 id="detail-title" class="text-xl font-bold text-white mb-2">Task Title</h2>
      <p id="detail-description" class="text-xs text-tinkoff-muted mb-6 leading-relaxed">
        Description of what the user needs to do to complete this activity.
      </p>

      <!-- Verification Section / Action Button -->
      <div id="detail-action-area" class="space-y-3 pt-4 border-t border-tinkoff-border">
        <!-- Button inserted dynamically -->
      </div>
    </div>
  </div>


  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Default Activities
    let activities = [
      { 
        id: 1, 
        title: 'Visit Welcome Booth', 
        description: 'Find the main reception desk at the entrance, meet the organizers, and scan their official QR code.',
        qrCode: 'booth_123', 
        completed: false 
      },
      { 
        id: 2, 
        title: 'Attend Morning Keynote', 
        description: 'Join the main stage presentation at 10:00 AM. Scan the QR code displayed on the side banner.',
        qrCode: 'keynote_456', 
        completed: false 
      },
      { 
        id: 3, 
        title: 'Complete Networking Challenge', 
        description: 'Connect with 3 fellow attendees, share contacts, and scan the networking wall QR code.',
        qrCode: 'network_789', 
        completed: false 
      }
    ];

    let currentActivityId = null;

    // --- NAVIGATION LOGIC --- //

    function showListScreen() {
      document.getElementById('screen-detail').classList.add('hidden');
      document.getElementById('screen-list').classList.remove('hidden');
      currentActivityId = null;

      // Hide Telegram Native Back Button
      if (tg.BackButton) {
        tg.BackButton.hide();
      }

      renderActivities();
    }

    function showDetailScreen(activityId) {
      currentActivityId = activityId;
      const activity = activities.find(a => a.id === activityId);
      if (!activity) return;

      // Render details
      document.getElementById('detail-title').innerText = activity.title;
      document.getElementById('detail-description').innerText = activity.description;

      const badge = document.getElementById('detail-status-badge');
      const actionArea = document.getElementById('detail-action-area');

      if (activity.completed) {
        badge.className = "inline-block px-3 py-1 rounded-full text-[10px] font-bold mb-3 bg-green-500/20 text-green-400";
        badge.innerText = "✓ Task Completed";

        actionArea.innerHTML = `
          <div class="p-4 bg-green-500/10 border border-green-500/30 rounded-2xl text-center">
            <div class="w-10 h-10 bg-green-500 text-black rounded-full flex items-center justify-center font-bold text-lg mx-auto mb-2">✓</div>
            <p class="text-xs font-semibold text-green-400">Activity Verified!</p>
            <p class="text-[10px] text-tinkoff-muted mt-1">You have successfully completed this task.</p>
          </div>
        `;
      } else {
        badge.className = "inline-block px-3 py-1 rounded-full text-[10px] font-bold mb-3 bg-tinkoff-yellow/20 text-tinkoff-yellow";
        badge.innerText = "Verification Required";

        actionArea.innerHTML = `
          <button onclick="startQrScanner()" class="w-full py-3.5 bg-tinkoff-yellow hover:bg-tinkoff-yellowHover text-black text-xs font-bold rounded-2xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
            Scan QR Code
          </button>
        `;
      }

      // Switch screens
      document.getElementById('screen-list').classList.add('hidden');
      document.getElementById('screen-detail').classList.remove('hidden');

      // Setup Telegram Native Back Button
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(showListScreen);
      }
    }

    // --- RENDER & STORAGE LOGIC --- //

    function loadSavedState() {
      if (tg.CloudStorage) {
        tg.CloudStorage.getItem('user_activities', (err, value) => {
          if (!err && value) {
            try {
              const savedStates = JSON.parse(value);
              activities.forEach(act => {
                if (savedStates[act.id] !== undefined) act.completed = savedStates[act.id];
              });
            } catch (e) {}
          }
          renderActivities();
        });
      } else {
        const saved = localStorage.getItem('user_activities');
        if (saved) {
          const savedStates = JSON.parse(saved);
          activities.forEach(act => {
            if (savedStates[act.id] !== undefined) act.completed = savedStates[act.id];
          });
        }
        renderActivities();
      }
    }

    function saveState() {
      const stateToSave = activities.reduce((acc, act) => {
        acc[act.id] = act.completed;
        return acc;
      }, {});

      const dataString = JSON.stringify(stateToSave);
      if (tg.CloudStorage) tg.CloudStorage.setItem('user_activities', dataString);
      localStorage.setItem('user_activities', dataString);
    }

    function resetProgress() {
      if (confirm('Are you sure you want to reset all progress?')) {
        activities.forEach(act => act.completed = false);
        saveState();
        renderActivities();
      }
    }

    function renderActivities() {
      const listEl = document.getElementById('activity-list');
      listEl.innerHTML = '';
      let completedCount = 0;

      activities.forEach(act => {
        if (act.completed) completedCount++;

        const item = document.createElement('div');
        item.onclick = () => showDetailScreen(act.id);
        item.className = `p-4 rounded-2xl border flex justify-between items-center transition-all cursor-pointer active:scale-[0.98] ${
          act.completed 
            ? 'border-green-500/30 bg-green-500/10' 
            : 'border-tinkoff-border bg-tinkoff-card hover:border-tinkoff-yellow/40 shadow-md'
        }`;

        item.innerHTML = `
          <div class="pr-2">
            <h3 class="font-semibold text-sm ${act.completed ? 'line-through opacity-50' : 'text-white'}">${act.title}</h3>
            <span class="text-[11px] ${act.completed ? 'text-green-400 font-medium' : 'text-tinkoff-muted'}">
              ${act.completed ? '✓ Verified' : 'Tap to view task'}
            </span>
          </div>
          ${
            act.completed
              ? `<div class="w-8 h-8 rounded-full bg-green-500 text-black flex items-center justify-center font-bold text-sm">✓</div>`
              : `<div class="text-tinkoff-yellow font-bold text-lg">→</div>`
          }
        `;
        listEl.appendChild(item);
      });

      const percent = Math.round((completedCount / activities.length) * 100);
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('progress-text').innerText = `${completedCount}/${activities.length} Completed`;
    }

    // --- QR SCANNER LOGIC --- //

    function startQrScanner() {
      if (!currentActivityId) return;

      if (tg.showScanQrPopup) {
        tg.showScanQrPopup({
          text: 'Align the activity QR code in the frame'
        }, handleQrResult);
      } else {
        alert('QR Scanner is not supported on this Telegram client.');
      }
    }

    function handleQrResult(scannedText) {
      const activity = activities.find(a => a.id === currentActivityId);

      if (activity && scannedText.trim() === activity.qrCode) {
        activity.completed = true;
        saveState();
        
        tg.closeScanQrPopup();
        tg.HapticFeedback?.notificationOccurred('success');
        tg.showAlert('🎉 Task Verified!');
        
        // Refresh the detail screen UI to show success
        showDetailScreen(currentActivityId);
        return true; 
      } else {
        tg.HapticFeedback?.notificationOccurred('error');
        tg.showAlert('❌ Invalid QR code for this task. Try again!');
        return false;
      }
    }

    loadSavedState();
  </script>
</body>
</html>
