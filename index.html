<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Activity Checklist</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[var(--tg-theme-bg-color,#f3f4f6)] text-[var(--tg-theme-text-color,#111827)] p-4 min-h-screen">

  <header class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-blue-600">Activity Checklist</h1>
    <p class="text-xs text-gray-500 mt-1">Scan the corresponding QR code to mark complete</p>
    
    <!-- Progress Indicator -->
    <div class="mt-4 bg-gray-200 dark:bg-gray-700 rounded-full h-2.5 max-w-xs mx-auto overflow-hidden">
      <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
    <span id="progress-text" class="text-xs font-semibold text-gray-500 mt-1 block">0/3 Completed</span>
  </header>

  <!-- Activity List -->
  <div id="activity-list" class="space-y-3 max-w-md mx-auto"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Make Web App full-screen inside Telegram

    // Define activities and their target QR codes
    const activities = [
      { id: 1, title: 'Visit Welcome Booth', qrCode: 'booth_123', completed: false },
      { id: 2, title: 'Attend Morning Keynote', qrCode: 'keynote_456', completed: false },
      { id: 3, title: 'Complete Networking Challenge', qrCode: 'network_789', completed: false }
    ];

    let currentActivityId = null;

    function renderActivities() {
      const listEl = document.getElementById('activity-list');
      listEl.innerHTML = '';

      let completedCount = 0;

      activities.forEach(act => {
        if (act.completed) completedCount++;

        const item = document.createElement('div');
        item.className = `p-4 rounded-2xl border flex justify-between items-center transition-all ${
          act.completed 
            ? 'border-green-500/30 bg-green-500/10' 
            : 'border-gray-200 bg-white dark:bg-gray-800 dark:border-gray-700 shadow-sm'
        }`;

        item.innerHTML = `
          <div>
            <h3 class="font-semibold text-sm ${act.completed ? 'line-through opacity-60' : ''}">${act.title}</h3>
            <span class="text-[10px] ${act.completed ? 'text-green-500 font-bold' : 'text-gray-400'}">
              ${act.completed ? '✓ Verified' : 'Pending Verification'}
            </span>
          </div>
          ${
            act.completed
              ? `<div class="w-8 h-8 rounded-full bg-green-500 text-white flex items-center justify-center font-bold text-sm">✓</div>`
              : `<button onclick="startQrScanner(${act.id})" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-md transition-all active:scale-95">
                  Scan QR
                 </button>`
          }
        `;
        listEl.appendChild(item);
      });

      // Update progress
      const percent = Math.round((completedCount / activities.length) * 100);
      document.getElementById('progress-bar').style.width = `${percent}%`;
      document.getElementById('progress-text').innerText = `${completedCount}/${activities.length} Completed`;
    }

    // Launch Telegram Native QR Camera
    function startQrScanner(activityId) {
      currentActivityId = activityId;

      if (tg.showScanQrPopup) {
        tg.showScanQrPopup({
          text: 'Scan the official activity QR code'
        }, handleQrResult);
      } else {
        alert('QR Scanner is not supported on this version of Telegram.');
      }
    }

    // Process the QR result
    function handleQrResult(scannedText) {
      const activity = activities.find(a => a.id === currentActivityId);

      if (activity && scannedText.trim() === activity.qrCode) {
        activity.completed = true;
        renderActivities();
        tg.closeScanQrPopup();
        tg.HapticFeedback?.notificationOccurred('success');
        tg.showAlert('🎉 Activity successfully completed!');
        return true; 
      } else {
        tg.HapticFeedback?.notificationOccurred('error');
        tg.showAlert('❌ Invalid QR code for this activity. Try again!');
        return false; // Keep scanner open on fail
      }
    }

    renderActivities();
  </script>
</body>
</html>
